<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form - USer Poll</title>
</head>

<body>
<header>
    <h1>WDD 130 | JOnathan Gómez | HTML Form - User Poll</h1>
</header>    
<main>
    <form>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="fullname">Full name:</label><br>
            <input type="text" id="fullname" name="fullname"><br>
            <label for="useremail">Email:</label><br>
            <input type="email" id="useremail" name="useremail"><br>
        </fieldset>
        <fieldset>
            <legend>Questions</legend>
            <label for="browsers">What is your favorite internet browser?</label>
            <select id="browsers" name="browsers">
                <option value="chrome">Google Chrome</option>
                <option value="explorer">Internet Explorer</option>
                <option value="Mozilla">Mozilla Forefox</option>
                <option value="opera">Opera</option>
            </select>
            <p></p>
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
            <p></p>
            <label for="places">List the places you have lived.</label>
            <textarea id="places" name="places" rows="4" placeholder="Stillwater Florida, Amsterdan, Monaco, Salt Lake City"></textarea>
        </fieldset>
        <button type="submit">Submit Poll</button>
    
    </form>
</main>
<footer>
    <p>©️2024 | HTML Form - User Poll Activity | Jonathan Gómez</p>
</footer>
</body>
</html>
